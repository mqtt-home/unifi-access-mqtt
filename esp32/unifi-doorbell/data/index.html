<!DOCTYPE html>
<html lang="de">
<head>
  <script>(function () {
  var root = document.documentElement
  if (!root.dataset.embed && / WallDisplay\//.test(navigator.userAgent)) root.dataset.embed = 'wall-display'
  var embedded = root.dataset.embed === 'wall-display'
  var mq = matchMedia('(prefers-color-scheme: dark)')
  function apply() {
    var dark = embedded || mq.matches
    root.classList.toggle('dark', dark)
    root.dataset.theme = dark ? 'dark' : 'light'
  }
  apply()
  if (mq.addEventListener) mq.addEventListener('change', apply)
})()</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F6F8">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090B0F">
    <title>Türklingel</title>
  <script type="module" crossorigin src="/app.js"></script>
  <link rel="stylesheet" crossorigin href="/style.css">
</head>
<body>
    <div id="app"></div>
</body>
</html>
